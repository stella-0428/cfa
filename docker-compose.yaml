services:
  db_service:
    networks:
    - app_network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: db_service
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    hostname: db_service
    ports:  
      - '5432:5432'
  customer_service:
    networks:
    - app_network
    restart: on-failure
    container_name: customer_service
    build: 
      context: ./webapp
      dockerfile: customer_service.dockerfile
    hostname: customer_service
    ports:
      - '3000:80'
  admin_service:
    networks:
    - app_network
    restart: on-failure
    container_name: admin_service
    build: 
      context: ./backend
      dockerfile: admin_service.dockerfile
    hostname: admin_service
    ports:
      - '8000:8000'
    depends_on:
      - db_service
networks:
  app_network:
    driver: bridge
    
 