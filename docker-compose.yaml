services:
  db_service:
    container_name: db_service
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: sales-sanitised
    hostname: db_service
    ports:  
      - '5432:5432'
  customer_service:
    container_name: customer_service
    build: 
      context: ./webapp
      dockerfile: customer_service.dockerfile
    hostname: customer_service
    ports:
      - '3000:3000'
  admin_service:
    container_name: admin_service
    build: 
      context: ./backend
      dockerfile: admin_service.dockerfile
    hostname: admin_service
    ports:
      - '8000:8000'
    depends_on:
      - db_service
    
 